</style><header><small>MillOS / village craft</small><h1>0.30, restored and refined.</h1><p>Dressed stone, blue roofs, timber joinery and traditional signwriting. The village landmarks return to their earlier character, alongside a newly authored canal boat.</p></header><main><figure><a href="accepted-day/village.png"><img loading="lazy" src="accepted-day/village.png" alt="The village"></a><figcaption><h2>The village</h2><p>The restored landmark silhouettes sit within the existing streets and grounds.</p></figcaption></figure><figure><a href="accepted-day/shop-baker.png"><img loading="lazy" src="accepted-day/shop-baker.png" alt="Bakery"></a><figcaption><h2>Bakery</h2><p>Wine-red enamel, gilt wheat crest and bounded traditional lettering.</p></figcaption></figure><figure><a href="accepted-day/shop-butcher.png"><img loading="lazy" src="accepted-day/shop-butcher.png" alt="Butcher"></a><figcaption><h2>Butcher</h2><p>Forest-green signboard and a framed trade monogram.</p></figcaption></figure><figure><a href="accepted-day/shop-general.png"><img loading="lazy" src="accepted-day/shop-general.png" alt="General Store"></a><figcaption><h2>General Store</h2><p>Navy-and-gold provisions sign, fitted to the original shopfront.</p></figcaption></figure><figure><a href="accepted-day/church.png"><img loading="lazy" src="accepted-day/church.png" alt="Village church"></a><figcaption><h2>Village church</h2><p>Rear spire, rose window, dressed corners and stepped buttresses.</p></figcaption></figure><figure><a href="accepted-day/hall.png"><img loading="lazy" src="accepted-day/hall.png" alt="Town hall"></a><figcaption><h2>Town hall</h2><p>Broad cream frontage, columned portico, clock tower and swept blue cupola.</p></figcaption></figure><figure><a href="accepted-day/pub.png"><img loading="lazy" src="accepted-day/pub.png" alt="Flour &amp; Barrel"></a><figcaption><h2>Flour &amp; Barrel</h2><p>Hipped thatch, timber framing, divided casements and the original inn name.</p></figcaption></figure><figure><a href="accepted-day/pub-sign.png"><img loading="lazy" src="accepted-day/pub-sign.png" alt="The inn sign"></a><figcaption><h2>The inn sign</h2><p>Double-sided framed lettering on its hanging iron bracket.</p></figcaption></figure><figure><a href="accepted-day/school.png"><img loading="lazy" src="accepted-day/school.png" alt="Schoolhouse"></a><figcaption><h2>Schoolhouse</h2><p>Cream masonry, tall classroom windows and an open bell tower.</p></figcaption></figure><figure><a href="accepted-day/forge.png"><img loading="lazy" src="accepted-day/forge.png" alt="Blacksmith"></a><figcaption><h2>Blacksmith</h2><p>A framed charcoal-and-gold nameboard above the forge entrance.</p></figcaption></figure><figure><a href="accepted-day/boat.png"><img loading="lazy" src="accepted-day/boat.png" alt="Flourish"></a><figcaption><h2>Flourish</h2><p>Tapered navy hull, burgundy coachwork and a cambered cream roof.</p></figcaption></figure><figure><a href="accepted-day/boat-rear.png"><img loading="lazy" src="accepted-day/boat-rear.png" alt="Stern deck"></a><figcaption><h2>Stern deck</h2><p>Brass tiller, guard rails, mooring bollards and teak decking.</p></figcaption></figure><figure><a href="accepted-day/boat-side.png"><img loading="lazy" src="accepted-day/boat-side.png" alt="Canal-side detail"></a><figcaption><h2>Canal-side detail</h2><p>Eight brass portholes, coachlines, painted roses and crisp boat lettering.</p></figcaption></figure><figure><a href="accepted-day/hall-approach.png"><img loading="lazy" src="accepted-day/hall-approach.png" alt="Town hall approach"></a><figcaption><h2>Town hall approach</h2><p>Grounded steps and civic benches placed clear of the building.</p></figcaption></figure><h2 class="section">After dark</h2><figure><a href="accepted-night/boat-side.png"><img loading="lazy" src="accepted-night/boat-side.png" alt="Warm cabin portholes"></a><figcaption><h2>Warm cabin portholes</h2><p>Existing scene lighting, with no extra lamps or shadow passes.</p></figcaption></figure><figure><a href="accepted-night/shop-baker.png"><img loading="lazy" src="accepted-night/shop-baker.png" alt="Bakery after dark"></a><figcaption><h2>Bakery after dark</h2><p>Existing scene lighting, with no extra lamps or shadow passes.</p></figcaption></figure><figure><a href="accepted-night/pub.png"><img loading="lazy" src="accepted-night/pub.png" alt="Flour &amp; Barrel after dark"></a><figcaption><h2>Flour &amp; Barrel after dark</h2><p>Existing scene lighting, with no extra lamps or shadow passes.</p></figcaption></figure></main><footer>Local scene review. <a href="VALIDATION.md">Validation and remaining limits</a>. No audio.</footer></html>
