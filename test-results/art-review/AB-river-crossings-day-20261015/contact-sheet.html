<!doctype html>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: #111; }
      main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
      figure { margin: 0; position: relative; }
      img { display: block; width: 100%; height: auto; }
      figcaption {
        position: absolute; left: 0; bottom: 0;
        font: 600 20px/1.4 ui-monospace, monospace; color: #fff;
        background: rgba(0,0,0,.65); padding: 2px 10px;
      }
    </style>
    <main>
      <figure>
        <img src="castle.png" alt="castle" />
        <figcaption>castle</figcaption>
      </figure></main>
