<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MillOS · Shipping dock</title>
  <style>
    :root {
      color-scheme: light;
      font:
        16px/1.5 system-ui,
        sans-serif;
      color: #1d2528;
      background: #eeede9;
      font-variant-numeric: tabular-nums;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 47rem;
      margin-inline: auto;
      padding: 1.75rem 1rem 3rem;
    }
    h1,
    h2,
    p,
    ul,
    dl,
    dd {
      margin: 0;
    }
    h1 {
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }
    h2 {
      font-size: 1.15rem;
      line-height: 1.25;
    }
    section {
      margin-block-start: 1.5rem;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    .facts,
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .facts {
      margin-block-start: 1rem;
    }
    .block {
      background: #dfdfd7;
      padding: 0.65rem 0.8rem;
    }
    dt,
    small,
    .secondary,
    .tag {
      color: #4b5759;
      font-size: 0.875rem;
    }
    .list {
      margin-block-start: 0.4rem;
    }
    .list li {
      border-block-end: 1px solid #b9beb8;
      padding: 0.4rem 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      column-gap: 0.75rem;
    }
    .list li > :last-child {
      text-align: end;
      flex: none;
    }
    .choices {
      margin-block-start: 0.75rem;
    }
    button {
      appearance: none;
      background: #faf9f5;
      border: 1px solid #687572;
      color: inherit;
      cursor: pointer;
      font: inherit;
      min-height: 2.75rem;
    }
    button:hover:not(:disabled) {
      background: #dee8e2;
    }
    :focus-visible {
      outline: 3px solid #125c64;
      outline-offset: 4px;
    }
    .choice {
      text-align: start;
      padding: 0.65rem 0.8rem;
      align-content: start;
    }
    .choice strong,
    .choice small {
      display: block;
    }
    .choice[data-selected] {
      background: #dce8df;
      border-color: #325747;
    }
    .choice:disabled {
      cursor: default;
    }
    .tag {
      display: block;
      min-height: 1.3em;
      margin-block-start: 0.2rem;
    }
    #receipt {
      border-block-start: 2px solid #687572;
      padding-block-start: 0.9rem;
    }
    #summary,
    #margin {
      margin-block-start: 0.35rem;
    }
    #next {
      margin-block-start: 0.8rem;
      padding: 0.35rem 0.8rem;
      font-weight: 650;
    }
    details {
      margin-block-start: 0.6rem;
    }
    summary {
      cursor: pointer;
      width: fit-content;
    }
    @media (max-width: 36rem) {
      main {
        padding-block-start: 1.1rem;
      }
      .facts,
      .choices {
        gap: 0.5rem;
      }
      .block,
      .choice {
        padding-inline: 0.55rem;
      }
      .list li {
        flex-wrap: wrap;
      }
      .list li > :last-child {
        text-align: start;
      }
    }
  </style>
  <main>
    <h1 id="title" tabindex="-1">Shipping dock</h1>
    <dl id="facts" class="facts"></dl>
    <section aria-labelledby="open-heading">
      <h2 id="open-heading"></h2>
      <ul id="orders" class="list"></ul>
    </section>
    <section aria-labelledby="offer-heading">
      <h2 id="offer-heading"></h2>
      <p id="offer-deadline" class="secondary"></p>
      <div class="choices">
        <button id="take" class="choice" type="button" disabled></button>
        <button id="wait" class="choice" type="button" disabled></button>
      </div>
      <p id="error" role="alert" hidden></p>
    </section>
    <section id="receipt" aria-labelledby="decision" hidden>
      <h2 id="decision" tabindex="-1"></h2>
      <p id="summary"></p>
      <p id="margin"></p>
      <details id="details">
        <summary id="receipts-label"></summary>
        <ul id="results" class="list"></ul>
      </details>
      <button id="next" type="button" hidden></button>
    </section>
  </main>
  <script src="replays.js"></script>
  <script>
    const query = new URLSearchParams(location.search);
    const pt = query.get('lang')?.toLowerCase() === 'pt-br';
    const locale = pt ? 'pt-BR' : 'en';
    const m = pt
      ? {
          title: 'Doca de expedição',
          orders: 'Pedidos em aberto',
          truck: 'Próximo caminhão (previsto)',
          stock: 'Estoque liberado',
          flour: 'Farinha de trigo',
          semolina: 'Fubá',
          offer: 'Aceitar mais {kg}?',
          due: 'Prazo: {time}',
          firstDue: 'Primeiro prazo: {time}',
          take: 'Aceitar agora',
          wait: 'Aguardar',
          defer: 'Aceitar após os pedidos atuais',
          partner: 'Sugestão do parceiro',
          clear: 'Previsão: nenhum risco adicional',
          risk: 'Previsão: +{n} pedidos em risco',
          booked: '{kg} em novos pedidos aceitos',
          stayed: 'Nenhum pedido novo aceito',
          receipts: 'Comprovantes dos pedidos',
          summary: 'Simulação: {good}/{total} no prazo, {trucks} saídas em {time}.',
          margin: 'Menor folga entre os pedidos atuais: {time}.',
          late: '{time} de atraso',
          early: '{time} de folga',
          onTime: 'No prazo',
          missed: 'Não entregue',
          next: 'Testar outra doca',
          error: 'Não foi possível carregar os dois cenários.',
        }
      : {
          title: 'Shipping dock',
          orders: 'Open orders',
          truck: 'Next truck (forecast)',
          stock: 'Released stock',
          flour: 'Wheat flour',
          semolina: 'Cornmeal',
          offer: 'Take on another {kg}?',
          due: 'Due in {time}',
          firstDue: 'First order due in {time}',
          take: 'Take it now',
          wait: 'Wait',
          defer: 'Take after the current orders',
          partner: 'Partner recommends',
          clear: 'Forecast: no extra orders at risk',
          risk: 'Forecast: +{n} orders at risk',
          booked: '{kg} of new orders booked',
          stayed: 'No new orders booked',
          receipts: 'Order receipts',
          summary: 'Replay: {good}/{total} on time, {trucks} departures in {time}.',
          margin: 'Tightest existing deadline: {time}.',
          late: '{time} late',
          early: '{time} to spare',
          onTime: 'On the deadline',
          missed: 'Undelivered',
          next: 'Try another dock',
          error: 'The two dock cases could not be loaded.',
        };
    const phrase = (key, values = {}) => m[key].replace(/\{(\w+)\}/g, (_, k) => values[k]);
    const byId = (id) => document.getElementById(id);
    const set = (id, value) => (byId(id).textContent = value);
    const number = new Intl.NumberFormat(locale, { maximumFractionDigits: 0 });
    const kg = (value) => `${number.format(value)} kg`;
    const time = (value) => {
      const minutes = Math.round(value);
      const hours = Math.floor(minutes / 60);
      return [hours && `${number.format(hours)} h`, `${minutes % 60} min`]
        .filter(Boolean)
        .join(' ');
    };
    const punctuality = (late) =>
      late === null
        ? m.missed
        : late === 0
          ? m.onTime
          : phrase(late > 0 ? 'late' : 'early', { time: time(Math.abs(late)) });
    const el = (tag, value, className) => {
      const node = document.createElement(tag);
      if (value !== undefined) node.textContent = value;
      if (className) node.className = className;
      return node;
    };
    const row = (name, detail, sub) => {
      const item = el('li');
      const lead = el('span', name);
      if (sub) lead.append(el('small', ` · ${sub}`));
      item.append(lead, el('strong', detail));
      return item;
    };
    const fact = (label, detail) => {
      const item = el('div', undefined, 'block');
      item.append(el('dt', label), el('dd', detail));
      return item;
    };

    document.documentElement.lang = locale;
    document.title = `MillOS · ${m.title}`;
    set('title', m.title);
    set('open-heading', m.orders);
    set('receipts-label', m.receipts);
    set('next', m.next);
    const cases = globalThis.dockCases;
    let current = query.get('start') === 'tight' ? 1 : 0;
    let visited = 0;
    const choices = ['take', 'wait'];
    let decided;

    function showDock() {
      const { orders, truck, tested, offer } = cases[current];
      decided = false;
      byId('receipt').hidden = true;
      byId('details').open = false;
      byId('facts').replaceChildren(
        fact(m.truck, `${time(truck.minutes)} · ${kg(truck.kg)}`),
        fact(
          m.stock,
          Object.entries(tested)
            .filter(([, weight]) => weight >= 0.5)
            .map(([product, weight]) => `${kg(weight)} ${m[product].toLowerCase()}`)
            .join(' · ') || kg(0)
        )
      );
      byId('orders').replaceChildren(
        ...orders.map((order) =>
          row(
            order.customer,
            `${kg(order.owed)} · ${phrase('due', { time: time(order.due) })}`,
            m[order.product]
          )
        )
      );
      set('offer-heading', phrase('offer', { kg: kg(offer.kg) }));
      set('offer-deadline', phrase('firstDue', { time: time(offer.firstDue) }));
      for (const choice of choices) {
        const button = byId(choice);
        button.replaceChildren(
          el('strong', m[choice]),
          el(
            'small',
            choice === 'wait'
              ? m.defer
              : offer.extraAtRisk
                ? phrase('risk', { n: number.format(offer.extraAtRisk) })
                : m.clear
          ),
          el('span', choice === offer.recommended ? m.partner : '', 'tag')
        );
        button.disabled = false;
        delete button.dataset.selected;
      }
    }

    function answer(choice) {
      if (decided) return;
      decided = true;
      const { addedKg, departures, results } = cases[current].branches[choice];
      byId(choice).dataset.selected = '';
      for (const option of choices) byId(option).disabled = true;
      set('decision', addedKg > 0 ? phrase('booked', { kg: kg(addedKg) }) : m.stayed);
      const good = results.filter((order) => order.late !== null && order.late <= 0).length;
      set(
        'summary',
        phrase('summary', {
          good,
          total: results.length,
          trucks: departures,
          time: time(Math.max(...results.map((order) => order.done ?? 0))),
        })
      );
      const currentOrders = results.filter((order) => order.current);
      const tightest = currentOrders.some((order) => order.late === null)
        ? null
        : Math.max(...currentOrders.map((order) => order.late));
      set('margin', phrase('margin', { time: punctuality(tightest) }));
      byId('results').replaceChildren(
        ...results.map((order) =>
          row(order.customer, punctuality(order.late), `${kg(order.shipped)} / ${kg(order.owed)}`)
        )
      );
      byId('next').hidden = ++visited >= cases.length;
      byId('receipt').hidden = false;
      byId('decision').focus();
    }

    if (!Array.isArray(cases) || cases.length !== 2) {
      set('error', m.error);
      byId('error').hidden = false;
    } else {
      for (const choice of choices) byId(choice).addEventListener('click', () => answer(choice));
      byId('next').addEventListener('click', () => {
        current = 1 - current;
        showDock();
        byId('title').focus();
      });
      showDock();
    }
  </script>
</html>
