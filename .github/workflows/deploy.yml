name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Validate release source
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run validate:releases

      - name: Rebuild the deployed v0.30 release for preservation
        run: |
          V030_SOURCE_SHA=$(node -e "const m=require('./release-matrix.json'); process.stdout.write(m.releases.find((r) => r.version === 'v0.30').sourceCommit)")
          git worktree add --detach "$RUNNER_TEMP/millos-v030" "$V030_SOURCE_SHA"
          npm ci --force --ignore-scripts --prefix "$RUNNER_TEMP/millos-v030"
          VERSION=v0.30 npm run build --prefix "$RUNNER_TEMP/millos-v030"

      - name: Build current release
        run: VERSION="v$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")" npm run build

      - name: Stage current and archived releases
        run: |
          npm run build:pages-staging -- \
            --archive-build "v0.30=$RUNNER_TEMP/millos-v030/dist"
          npm run validate:releases -- --staging staging

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: staging

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
