name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate release candidate
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run check:dead-code
          npm run validate:assets
          npm run validate:depth
          npm run validate:shaders
          npm run validate:credits
          npm test
          npm run build
          npm run validate:bundle

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@b946ed27a675d653b308f29a7bbad813b85bf7aa # v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tar -czvf "millos-${RELEASE_TAG}.tar.gz" dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            millos-*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: GitHub Pages deployment is owned solely by deploy.yml (on push to main),
  # which publishes the current package release line plus /v0.20/ and /v0.10/
  # with a root
  # redirect. A previous deploy-ghpages job here built a flat base-"/" site and
  # deployed it to the same github-pages environment on every tag push, clobbering
  # that versioned layout. It was removed; release.yml now only cuts the GitHub
  # Release (changelog + archive).
