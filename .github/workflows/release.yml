name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Validate release source
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Build
        run: npm run build

      - name: Create release archive
        run: tar -czvf "millos-${{ github.ref_name }}.tar.gz" dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MillOS ${{ github.ref_name }}
          generate_release_notes: true
          files: millos-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub Pages deployment is owned solely by deploy.yml. Keeping release
  # publication separate prevents a tag build from replacing the versioned site.
