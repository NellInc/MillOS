name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check

      # Static contract gates that need no build or browser. They exist locally
      # and were never run in CI, so drift only surfaced on a developer machine.
      - name: Validate depth policy
        run: npm run validate:depth

      - name: Validate shader contracts
        run: npm run validate:shaders

      - name: Typecheck agent plane
        run: npm run agent:typecheck

      - name: Generate and check agent manifest
        run: npm run agent:manifest && npm run agent:manifest:check

  test:
    if: github.event_name != 'workflow_dispatch'
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build-assembly:
    name: Build Assembly
    runs-on: ubuntu-24.04
    needs: [lint, test]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.lint.result == 'success' && needs.test.result == 'success')) }}
    outputs:
      dist-sha256: ${{ steps.dist-checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: VERSION="v$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")" npm run build

      # Both read dist/ and src/ only; neither needs a GPU or a browser.
      - name: Validate bundle budget
        run: npm run validate:bundle

      - name: Validate module reachability
        run: npm run validate:reachability

      - name: Record built assembly checksum
        id: dist-checksum
        run: |
          digest=$(node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          const files = readdirSync('dist', { recursive: true }).sort()
            .filter((file) => statSync(`dist/${file}`).isFile());
          const entries = files.map((file) => [file,
            createHash('sha256').update(readFileSync(`dist/${file}`)).digest('hex')]);
          console.log(createHash('sha256').update(JSON.stringify(entries)).digest('hex'));
          NODE
          )
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  build:
    if: github.event_name != 'workflow_dispatch'
    # Preserve the Build check identity: it is green only after UI acceptance.
    name: Build
    runs-on: macos-15
    needs: build-assembly
    timeout-minutes: 15
    env:
      MILLOS_CI_DIST_SHA256: ${{ needs.build-assembly.outputs.dist-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the Linux-built assembly from this workflow run
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify built assembly checksum
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          const files = readdirSync('dist', { recursive: true }).sort()
            .filter((file) => statSync(`dist/${file}`).isFile());
          const entries = files.map((file) => [file,
            createHash('sha256').update(readFileSync(`dist/${file}`)).digest('hex')]);
          const digest = createHash('sha256').update(JSON.stringify(entries)).digest('hex');
          assert.equal(digest, process.env.MILLOS_CI_DIST_SHA256);
          console.log(`Verified Linux-built assembly: ${digest}`);
          NODE

      - name: Install pinned Chromium for Jev UI acceptance
        run: npx playwright install --no-shell chromium

      - name: Validate Jev personal-key flow in desktop and mobile layouts
        timeout-minutes: 8
        # Standard public macOS VM, with no paid runner or desktop registration.
        # Metal availability is tested, not inferred from the runner's CPU label.
        # Working if actual Metal WebGL and both full-world UI flows pass sandboxed.
        run: node scripts/validate-jev-browser.mjs --metal-renderer

      - name: Upload Jev browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jev-browser
          path: test-results/jev-browser/
          if-no-files-found: ignore
          retention-days: 7

  installed-chrome-contrast:
    # Diagnostic only. Required Build retains its original browser and assertions.
    # Working if this dispatch records actual installed Chrome on the selected runner
    # and never supplies a passing required Build check or a deployment.
    name: Installed Chrome feasibility (diagnostic)
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    needs: build-assembly
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      MILLOS_CI_DIST_SHA256: ${{ needs.build-assembly.outputs.dist-sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Confirm unchanged application inputs
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const base = 'e62830c99a460479beb9755179e3613b0da3a3b5';
          const changed = execFileSync('git', ['diff', '--name-only', base, 'HEAD'],
            { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          assert.deepEqual(changed, ['.github/workflows/ci.yml',
            'scripts/lib/metal-browser-admission.mjs', 'scripts/lib/metal-browser-admission.test.mjs',
            'scripts/validate-jev-browser.mjs']);
          console.log(`Application inputs unchanged from ${base}; diagnostic harness only`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download the Linux-built assembly from this workflow run
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Verify built assembly checksum
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          const files = readdirSync('dist', { recursive: true }).sort()
            .filter((file) => statSync(`dist/${file}`).isFile());
          const entries = files.map((file) => [file,
            createHash('sha256').update(readFileSync(`dist/${file}`)).digest('hex')]);
          const digest = createHash('sha256').update(JSON.stringify(entries)).digest('hex');
          assert.equal(digest, process.env.MILLOS_CI_DIST_SHA256);
          console.log(`Verified Linux-built assembly: ${digest}`);
          NODE

      - name: Record installed Chrome identity
        run: |
          executable='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$executable"
          version=$("$executable" --version | grep -Eo '[0-9]+(\.[0-9]+){3}' | head -n 1)
          test -n "$version"
          echo "MILLOS_CHROME_PREFLIGHT_VERSION=$version" >> "$GITHUB_ENV"
          echo "Installed Chrome $version: $executable"

      # Read-only samples of this validator's own descendant processes can
      # distinguish JS work from renderer/driver waits after telemetry stalls.
      # Working if timeout evidence includes owned PID stacks, without changing
      # application inputs, Metal rendering, UI assertions or the eight-minute cap.
      - name: Trace unchanged Jev flow on installed Chrome
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import { spawn, execFileSync, execFile } from 'node:child_process';
          import { mkdir, readFile, writeFile, stat } from 'node:fs/promises';
          import { promisify } from 'node:util';
          const execute = promisify(execFile);
          const output = 'test-results/jev-browser-installed';
          await mkdir(output, { recursive: true });
          const child = spawn(process.execPath,
            ['scripts/validate-jev-browser.mjs', '--installed-chrome', '--metal-renderer', '--software-compositor'],
            { stdio: 'inherit' });
          const records = [];
          let ended = false;
          const completion = new Promise(resolve => child.once('exit', (code, signal) => {
            ended = true;
            resolve({ code, signal });
          }));
          const timers = [45, 120, 210].map(seconds => setTimeout(async () => {
            if (ended) return;
            const record = { at: new Date().toISOString(), ownerPid: child.pid, samples: [] };
            records.push(record);
            try {
              const rows = execFileSync('ps', ['-axo', 'pid=,ppid=,pcpu=,rss=,args='],
                { encoding: 'utf8' }).trim().split('\n').map(line => {
                  const match = line.trim().match(/^(\d+)\s+(\d+)\s+(\S+)\s+(\d+)\s+(.*)$/);
                  return match ? { pid: +match[1], ppid: +match[2], cpu: +match[3],
                    rssKiB: +match[4], args: match[5] } : null;
                }).filter(Boolean);
              const owned = new Set([child.pid]);
              for (let changed = true; changed;) {
                changed = false;
                for (const row of rows) if (owned.has(row.ppid) && !owned.has(row.pid)) {
                  owned.add(row.pid); changed = true;
                }
              }
              record.processes = rows.filter(row => owned.has(row.pid));
              const info = await stat(`${output}/result.json`).catch(() => null);
              record.observationAgeMs = info ? Date.now() - info.mtimeMs : null;
              record.phase = JSON.parse(await readFile(`${output}/result.json`, 'utf8'))?.phase;
              await writeFile(`${output}/process-profile.json`, JSON.stringify(records, null, 2));
              const selected = [record.processes.find(row => row.pid === child.pid),
                ...record.processes.filter(row => /--type=renderer/.test(row.args)),
                record.processes.find(row => /--type=gpu-process/.test(row.args)),
                record.processes.find(row => /Google Chrome/.test(row.args) && !/--type=/.test(row.args))]
                .filter(Boolean);
              for (const row of selected) {
                if (ended) break;
                const file = `${output}/sample-${seconds}-${row.pid}.txt`;
                try {
                  await execute('/usr/bin/sample', [String(row.pid), '2', '5', '-file', file],
                    { timeout: 15000, maxBuffer: 1024 * 1024 });
                  record.samples.push({ pid: row.pid, file });
                } catch (error) {
                  record.samples.push({ pid: row.pid, error: error.message });
                }
                await writeFile(`${output}/process-profile.json`, JSON.stringify(records, null, 2));
              }
            } catch (error) {
              record.error = error.message;
              await writeFile(`${output}/process-profile.json`, JSON.stringify(records, null, 2));
            }
          }, seconds * 1000));
          const terminal = await completion;
          for (const timer of timers) clearTimeout(timer);
          await writeFile(`${output}/trace-terminal.json`, JSON.stringify(terminal));
          process.exitCode = terminal.code ?? 1;
          NODE

      - name: Upload installed Chrome diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jev-browser-installed-diagnostic
          path: test-results/jev-browser-installed/
          if-no-files-found: ignore
          retention-days: 7

  build-proxy:
    if: github.event_name != 'workflow_dispatch'
    name: Build SCADA Proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scada-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scada-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present
