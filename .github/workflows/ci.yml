name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck --if-present || npx tsc --noEmit

      - name: Check formatting
        run: npm run format:check

      # Static contract gates that need no build or browser. They exist locally
      # and were never run in CI, so drift only surfaced on a developer machine.
      - name: Validate depth policy
        run: npm run validate:depth

      - name: Validate shader contracts
        run: npm run validate:shaders

      - name: Typecheck agent plane
        run: npm run agent:typecheck

      - name: Generate and check agent manifest
        run: npm run agent:manifest && npm run agent:manifest:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --reporter=verbose

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: success()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: VERSION="v$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")" npm run build

      # Both read dist/ and src/ only; neither needs a GPU or a browser.
      - name: Validate bundle budget
        run: npm run validate:bundle

      - name: Validate module reachability
        run: npm run validate:reachability

      - name: Install browser for Jev UI acceptance
        run: npx playwright install --with-deps chromium

      - name: Validate Jev personal-key flow in desktop and mobile layouts
        timeout-minutes: 8
        run: node scripts/validate-jev-browser.mjs

      - name: Upload Jev browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jev-browser
          path: test-results/jev-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-proxy:
    name: Build SCADA Proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scada-proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scada-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present
