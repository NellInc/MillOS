name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.29.0'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Configure kubeconfig
        run: |
          set -euo pipefail
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}

      - name: Verify externally managed SCADA secret
        run: |
          set -euo pipefail
          kubectl apply -f scada-proxy/k8s/namespace.yaml
          READ_KEY=$(kubectl get secret scada-proxy-secrets -n millos-scada -o jsonpath='{.data.SCADA_API_KEY}')
          if [[ -z "$READ_KEY" ]]; then
            echo "scada-proxy-secrets must contain a non-empty SCADA_API_KEY" >&2
            exit 1
          fi
          WRITE_ENABLED=$(sed -n "s/^[[:space:]]*SCADA_ENABLE_WRITES:[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" scada-proxy/k8s/configmap.yaml)
          if [[ "$WRITE_ENABLED" == "true" ]]; then
            WRITE_KEY=$(kubectl get secret scada-proxy-secrets -n millos-scada -o jsonpath='{.data.SCADA_WRITE_API_KEY}')
            if [[ -z "$WRITE_KEY" || "$WRITE_KEY" == "$READ_KEY" ]]; then
              echo "Enabled writes require a distinct, non-empty SCADA_WRITE_API_KEY" >&2
              exit 1
            fi
          fi

      - name: Update image tag
        working-directory: scada-proxy/k8s
        env:
          DEPLOY_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid deployment version: $DEPLOY_VERSION" >&2
            exit 1
          fi
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          IMAGE_NAME="${{ env.REGISTRY }}/${REPOSITORY}/scada-proxy:${DEPLOY_VERSION}"
          kustomize edit set image millos/scada-proxy="$IMAGE_NAME"

      - name: Apply to cluster
        working-directory: scada-proxy/k8s
        run: kubectl apply -k .

      - name: Wait for rollout
        run: kubectl rollout status deployment/scada-proxy -n millos-scada --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n millos-scada -l app.kubernetes.io/name=scada-proxy
          kubectl get svc -n millos-scada

      - name: Run smoke tests
        run: |
          set -euo pipefail
          # Port forward for testing
          kubectl port-forward svc/scada-proxy 3001:3001 -n millos-scada &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT

          # Health check
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3001/health
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:3001/ready

          echo "Deployment verified successfully"
