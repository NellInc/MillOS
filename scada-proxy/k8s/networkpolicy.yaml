apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scada-proxy
  namespace: millos-scada
  labels:
    app.kubernetes.io/name: scada-proxy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: scada-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from nginx ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001

    # Allow same-namespace operational access such as a bounded smoke test.
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3001

  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Industrial egress is deliberately absent from the base. A deployment
    # overlay must add only the exact plant CIDRs and ports it owns. Broad RFC
    # 1918 access gives a compromised proxy reach into unrelated private hosts.
