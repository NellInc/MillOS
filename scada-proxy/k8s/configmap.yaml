apiVersion: v1
kind: ConfigMap
metadata:
  name: scada-proxy-config
  namespace: millos-scada
  labels:
    app.kubernetes.io/name: scada-proxy
    app.kubernetes.io/component: config
data:
  PORT: '3001'
  POLL_INTERVAL: '1000'
  LOG_LEVEL: 'info'
  ALLOWED_ORIGINS: 'https://www.millos.net'
  TRUST_PROXY_HOPS: '1'
  RATE_LIMIT_MAX: '2000'
  WRITE_RATE_LIMIT_MAX: '120'
  WS_MESSAGE_RATE_MAX: '120'
  WS_MAX_CLIENTS: '100'
  SCADA_ENABLE_WRITES: 'false'
  OPCUA_ENDPOINT: ''
  MODBUS_HOST: ''
  MODBUS_PORT: '502'
