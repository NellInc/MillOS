apiVersion: v1
kind: Secret
metadata:
  name: scada-proxy-secrets
  namespace: millos-scada
  labels:
    app.kubernetes.io/name: scada-proxy
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # OPC-UA Authentication (if required)
  OPCUA_USERNAME: ''
  OPCUA_PASSWORD: ''

  # API Key for proxy authentication
  # SECURITY: Replace this with your actual API key using kubectl or sealed-secrets
  # DO NOT commit real API keys to git - use external secret management
  # Example: kubectl create secret generic scada-proxy-secrets --from-literal=SCADA_API_KEY=your-real-key
  SCADA_API_KEY: ''

  # Required only when SCADA_ENABLE_WRITES=true. It must differ from SCADA_API_KEY.
  SCADA_WRITE_API_KEY: ''
