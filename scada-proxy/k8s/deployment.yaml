apiVersion: apps/v1
kind: Deployment
metadata:
  name: scada-proxy
  namespace: millos-scada
  labels:
    app.kubernetes.io/name: scada-proxy
    app.kubernetes.io/component: backend
spec:
  # One process owns each industrial connection. Do not scale above one until
  # leader election or explicit read/write partitioning is implemented.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scada-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scada-proxy
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: scada-proxy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: scada-proxy
          image: millos/scada-proxy:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /tmp
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: PORT
            - name: POLL_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: POLL_INTERVAL
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: LOG_LEVEL
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: ALLOWED_ORIGINS
            - name: TRUST_PROXY_HOPS
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: TRUST_PROXY_HOPS
            - name: RATE_LIMIT_MAX
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: RATE_LIMIT_MAX
            - name: WRITE_RATE_LIMIT_MAX
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: WRITE_RATE_LIMIT_MAX
            - name: WS_MESSAGE_RATE_MAX
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: WS_MESSAGE_RATE_MAX
            - name: WS_MAX_CLIENTS
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: WS_MAX_CLIENTS
            - name: SCADA_ENABLE_WRITES
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: SCADA_ENABLE_WRITES
            - name: OPCUA_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: OPCUA_ENDPOINT
            - name: MODBUS_HOST
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: MODBUS_HOST
            - name: MODBUS_PORT
              valueFrom:
                configMapKeyRef:
                  name: scada-proxy-config
                  key: MODBUS_PORT
            - name: OPCUA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: scada-proxy-secrets
                  key: OPCUA_USERNAME
                  optional: true
            - name: OPCUA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scada-proxy-secrets
                  key: OPCUA_PASSWORD
                  optional: true
            - name: SCADA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scada-proxy-secrets
                  key: SCADA_API_KEY
            - name: SCADA_WRITE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scada-proxy-secrets
                  key: SCADA_WRITE_API_KEY
                  optional: true

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: scada-proxy
                topologyKey: kubernetes.io/hostname
