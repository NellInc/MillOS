apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: millos-scada

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: millos
      app.kubernetes.io/managed-by: kustomize
    # These are ownership metadata for MillOS resources. Applying them to
    # selectors also mutates external selectors such as kube-dns, which can
    # make the NetworkPolicy match no DNS pods.
    includeSelectors: false

images:
  - name: millos/scada-proxy
    newTag: latest
