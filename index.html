<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP connect-src third-party domains and their runtime consumers:
      - https://generativelanguage.googleapis.com Gemini cloud AI (GeminiSettingsModal)
      - https://openrouter.ai                     opt-in Jev advisory (jevClient.ts)
      - https://cdn.jsdelivr.net                  troika-three-text unicode-font-resolver fallback
                                                  for glyphs outside the self-hosted Inter
                                                  (src/components/shared/SceneText.tsx)
      - https://huggingface.co + https://*.hf.co  @mlc-ai/web-llm model weights
                                                  (Qwen3-4B-q4f16_1-MLC); HF LFS blobs
                                                  are served from *.hf.co
      - https://raw.githubusercontent.com         @mlc-ai/web-llm WASM model libs
                                                  (mlc-ai/binary-mlc-llm-libs/web-llm-models)
      These are NOT dead trust surface: they back the on-device WebGPU neural core
      (src/utils/webgpuClient.ts, webgpuWorker.ts). The references live inside the
      web-llm dependency's appConfig, so a grep of src/ alone will not surface them.
      script-src 'unsafe-eval' is required by the wasm-bindgen glue in
      @dimforge/rapier3d-compat (new Function) and by WASM compilation.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      img-src 'self' data: blob: https://www.millos.net;
      connect-src 'self' blob: ws: wss: https://openrouter.ai https://generativelanguage.googleapis.com https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co https://raw.githubusercontent.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    "
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="color-scheme" content="dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="An uncrewed grain mill in your browser: fifteen machines turn wheat into flour, autonomous forklifts and trucks move it, and 122 SCADA tags track every step."
    />
    <meta name="author" content="Nell Watson" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      name="keywords"
      content="MillOS, grain mill, digital twin, 3D simulation, SCADA, industrial automation, AI, React Three Fiber, agentic AI"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.millos.net/" />
    <meta property="og:title" content="MillOS | 3D Grain Mill Operations Simulator" />
    <meta
      property="og:description"
      content="An uncrewed grain mill in your browser: fifteen machines turn wheat into flour, with autonomous forklifts, scheduled trucks and 122 simulated SCADA tags in view."
    />
    <meta property="og:image" content="https://www.millos.net/og-image.png" />
    <meta
      property="og:image:alt"
      content="An uncrewed 3D grain mill: a glass-walled milling hall, grain silos and truck yard below green hills"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="MillOS" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.millos.net/" />
    <meta name="twitter:title" content="MillOS | 3D Grain Mill Operations Simulator" />
    <meta
      name="twitter:description"
      content="An uncrewed grain mill in your browser: fifteen machines turn wheat into flour while autonomous forklifts and scheduled trucks keep it moving."
    />
    <meta name="twitter:image" content="https://www.millos.net/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="An uncrewed 3D grain mill: a glass-walled milling hall, grain silos and truck yard below green hills"
    />
    <meta name="twitter:creator" content="@NellWatson" />

    <!-- Additional SEO -->
    <link rel="canonical" href="https://www.millos.net/" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.millos.net/#website",
            "url": "https://www.millos.net/",
            "name": "MillOS",
            "description": "A browser-based 3D grain mill operations simulator."
          },
          {
            "@type": "WebApplication",
            "@id": "https://www.millos.net/#application",
            "name": "MillOS",
            "description": "An uncrewed 3D grain mill operations simulator in the browser, with autonomous forklifts, scheduled trucks, live production metrics and a simulated SCADA workspace.",
            "applicationCategory": "SimulationApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a WebGL-capable browser",
            "url": "https://www.millos.net/",
            "image": "https://www.millos.net/og-image.png",
            "isPartOf": { "@id": "https://www.millos.net/#website" },
            "author": {
              "@type": "Person",
              "name": "Nell Watson"
            }
          }
        ]
      }
    </script>

    <title>MillOS | 3D Grain Mill Operations Simulator</title>
    <!-- Inter + JetBrains Mono are now self-hosted (see src/fonts.css), so there
         is no Google Fonts <link> and no third-party IP transmission on load. -->
    <noscript>
      <style>
        .loading-screen {
          display: none;
        }
        .noscript-message {
          color: #dbe6e2;
          font:
            16px system-ui,
            sans-serif;
          padding: 2rem;
          text-align: center;
        }
      </style>
    </noscript>
    <!-- The inline shell mirrors the first frame of LoadingScreen.tsx so the
         hand-off at React mount does not jump. Keep the two in step. -->
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: #0a0f1a;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #081015;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        z-index: 9999;
      }
      .loading-logo {
        font-size: 56px;
        margin-bottom: 14px;
      }
      .loading-text,
      .loading-sub {
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
      }
      .loading-text {
        color: #dbe6e2;
        font-size: 17px;
        font-weight: 650;
        letter-spacing: 0.08em;
      }
      .loading-sub {
        color: #9fb3ad;
        font-size: 13px;
        margin-top: 8px;
        min-height: 20px;
      }
      .loading-bar {
        width: min(320px, 78vw);
        height: 4px;
        background: #1c2b2f;
        margin-top: 22px;
        border-radius: 999px;
        overflow: hidden;
      }
      .loading-bar::after {
        content: '';
        display: block;
        width: 50%;
        height: 100%;
        background: #d99a3d;
        animation: loading 1.5s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-bar::after {
          animation: none;
          transform: none;
          width: 35%;
        }
      }
      @keyframes loading {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="noscript-message">
        MillOS runs a live 3D grain mill in your browser and needs JavaScript and WebGL. Enable
        JavaScript and reload to step inside.
      </div>
    </noscript>
    <div id="root">
      <div class="loading-screen" role="status" aria-label="Loading MillOS">
        <div class="loading-logo" aria-hidden="true">🏭</div>
        <div class="loading-text">WARMING UP THE ROLLERS</div>
        <div class="loading-sub">Firing up the mill</div>
        <div class="loading-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
